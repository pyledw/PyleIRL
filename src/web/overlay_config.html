<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Overlay Configuration</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap');
        
        body {
            margin: 0;
            padding: 40px;
            font-family: 'Inter', sans-serif;
            background: #1e1e1e;
            color: #eee;
        }

        h1 { margin-top: 0; }

        .container {
            display: flex;
            gap: 40px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .controls {
            flex: 1;
            background: #2a2a2a;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .preview {
            flex: 2;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .section-title {
            font-size: 1.2rem;
            font-weight: 600;
            border-bottom: 1px solid #444;
            padding-bottom: 5px;
            margin-bottom: 10px;
            margin-top: 10px;
        }

        .setting-row {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
        }

        .setting-row label {
            flex: 1;
        }
        
        select, input[type="number"], input[type="range"] {
            background: #333;
            color: white;
            border: 1px solid #555;
            padding: 5px;
            border-radius: 4px;
        }

        /* Drag and drop list */
        .sortable-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .sortable-item {
            background: #3a3a3a;
            padding: 10px;
            margin-bottom: 8px;
            border-radius: 4px;
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: grab;
            border: 1px solid #555;
            user-select: none;
        }
        
        .sortable-item:active {
            cursor: grabbing;
        }

        .drag-handle {
            color: #888;
            cursor: grab;
            font-size: 1.2rem;
        }

        input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        .url-box {
            background: #111;
            padding: 15px;
            border-radius: 4px;
            font-family: monospace;
            word-break: break-all;
            border: 1px solid #444;
            color: #4CAF50;
            font-size: 1.1rem;
        }

        iframe {
            width: 100%;
            height: 600px;
            border: 2px dashed #444;
            background: url('data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAoAAAAKCAYAAACNMs+9AAAAOklEQVQYV2NkYGAwYkAD////Z4TRMIIApgFkRSADcIphGkE02TRj1YxLM7Ji0gO4XEK2k80fDAwMAP8pLxf78rKTAAAAAElFTkSuQmCC');
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="controls">
            <h1>Overlay Configurator</h1>
            
            <div>
                <div class="section-title">Metrics (Drag to reorder)</div>
                <ul class="sortable-list" id="metrics-list">
                    <li class="sortable-item" data-id="status" draggable="true">
                        <span class="drag-handle">☰</span>
                        <input type="checkbox" id="chk-status" checked onchange="updatePreview()">
                        <label for="chk-status" style="cursor:pointer;flex:1;">Live Status</label>
                    </li>
                    <li class="sortable-item" data-id="kbps" draggable="true">
                        <span class="drag-handle">☰</span>
                        <input type="checkbox" id="chk-kbps" checked onchange="updatePreview()">
                        <label for="chk-kbps" style="cursor:pointer;flex:1;">Bitrate (Mbps)</label>
                    </li>
                    <li class="sortable-item" data-id="scene" draggable="true">
                        <span class="drag-handle">☰</span>
                        <input type="checkbox" id="chk-scene" checked onchange="updatePreview()">
                        <label for="chk-scene" style="cursor:pointer;flex:1;">Current Scene</label>
                    </li>
                    <li class="sortable-item" data-id="sync" draggable="true">
                        <span class="drag-handle">☰</span>
                        <input type="checkbox" id="chk-sync" checked onchange="updatePreview()">
                        <label for="chk-sync" style="cursor:pointer;flex:1;">Audio Drift</label>
                    </li>
                    <li class="sortable-item" data-id="db" draggable="true">
                        <span class="drag-handle">☰</span>
                        <input type="checkbox" id="chk-db" checked onchange="updatePreview()">
                        <label for="chk-db" style="cursor:pointer;flex:1;">Audio DB Level</label>
                    </li>
                </ul>
            </div>

            <div>
                <div class="section-title">Appearance</div>
                
                <div class="setting-row">
                    <label for="sel-layout">Layout</label>
                    <select id="sel-layout" onchange="updatePreview()">
                        <option value="vertical">Vertical</option>
                        <option value="horizontal">Horizontal</option>
                    </select>
                </div>

                <div class="setting-row">
                    <label style="display:flex; align-items:center; gap:8px;">
                        <input type="checkbox" id="chk-condensed" onchange="updatePreview()"> Condensed Mode (Single Bar)
                    </label>
                </div>

                <div class="setting-row">
                    <label for="inp-scale">Scale / Font Size</label>
                    <input type="number" id="inp-scale" value="1.0" step="0.1" min="0.5" max="3.0" onchange="updatePreview()" style="width: 60px;">
                </div>

                <div class="setting-row">
                    <label for="inp-spacing">Spacing (px)</label>
                    <input type="number" id="inp-spacing" value="12" step="1" min="0" max="100" onchange="updatePreview()" style="width: 60px;">
                </div>

                <div class="setting-row">
                    <label for="inp-opacity">Background Opacity</label>
                    <input type="number" id="inp-opacity" value="0.65" step="0.05" min="0" max="1.0" onchange="updatePreview()" style="width: 60px;">
                </div>
                
                <div class="setting-row" style="margin-top: 15px;">
                    <label style="display:flex; align-items:center; gap:8px;">
                        <input type="checkbox" id="chk-labels" checked onchange="updatePreview()"> Show Labels
                    </label>
                </div>
                
                <div class="setting-row">
                    <label style="display:flex; align-items:center; gap:8px;">
                        <input type="checkbox" id="chk-icons" checked onchange="updatePreview()"> Show Icons
                    </label>
                </div>
            </div>

            <div style="margin-top: 20px;">
                <div class="section-title">Browser Source URL</div>
                <div class="url-box" id="url-box"></div>
            </div>
        </div>

        <div class="preview">
            <h3>Live Preview</h3>
            <iframe id="preview-frame" src="/overlay"></iframe>
        </div>
    </div>

    <script>
        function updatePreview() {
            const baseUrl = window.location.origin + "/overlay";
            const params = new URLSearchParams();

            // Visibility
            const items = document.querySelectorAll('.sortable-item');
            const orderArr = [];
            items.forEach(item => {
                const id = item.getAttribute('data-id');
                orderArr.push(id);
                if (!document.getElementById(`chk-${id}`).checked) {
                    params.append(id, 'off');
                }
            });

            // Order
            params.append('order', orderArr.join(','));

            // Appearance
            const layout = document.getElementById('sel-layout').value;
            if (layout !== 'vertical') params.append('layout', layout);

            if (document.getElementById('chk-condensed').checked) params.append('condensed', 'on');

            const scale = document.getElementById('inp-scale').value;
            if (scale !== "1.0" && scale !== "1") params.append('scale', scale);

            const spacing = document.getElementById('inp-spacing').value;
            if (spacing !== "12") params.append('spacing', spacing);

            const opacity = document.getElementById('inp-opacity').value;
            if (opacity !== "0.65") params.append('opacity', opacity);

            if (!document.getElementById('chk-labels').checked) params.append('labels', 'off');
            if (!document.getElementById('chk-icons').checked) params.append('icons', 'off');

            const finalUrl = params.toString() ? `${baseUrl}?${params.toString()}` : baseUrl;
            
            document.getElementById('url-box').textContent = finalUrl;
            document.getElementById('preview-frame').src = `/overlay${params.toString() ? '?' + params.toString() : ''}`;
        }

        // Drag and Drop Logic
        const list = document.getElementById('metrics-list');
        let draggedItem = null;

        list.addEventListener('dragstart', (e) => {
            draggedItem = e.target.closest('li');
            e.dataTransfer.effectAllowed = 'move';
            e.dataTransfer.setData('text/html', draggedItem.innerHTML);
            setTimeout(() => { draggedItem.style.opacity = '0.5'; }, 0);
        });

        list.addEventListener('dragover', (e) => {
            e.preventDefault();
            const afterElement = getDragAfterElement(list, e.clientY);
            const currentItem = e.target.closest('li');
            
            if (draggedItem && currentItem && draggedItem !== currentItem) {
                if (afterElement == null) {
                    list.appendChild(draggedItem);
                } else {
                    list.insertBefore(draggedItem, afterElement);
                }
            }
        });

        list.addEventListener('dragend', () => {
            if (draggedItem) {
                draggedItem.style.opacity = '1';
                draggedItem = null;
                updatePreview();
            }
        });

        function getDragAfterElement(container, y) {
            const draggableElements = [...container.querySelectorAll('.sortable-item:not([style*="opacity: 0.5"])')];

            return draggableElements.reduce((closest, child) => {
                const box = child.getBoundingClientRect();
                const offset = y - box.top - box.height / 2;
                if (offset < 0 && offset > closest.offset) {
                    return { offset: offset, element: child };
                } else {
                    return closest;
                }
            }, { offset: Number.NEGATIVE_INFINITY }).element;
        }

        // Initialize
        updatePreview();
    </script>
</body>
</html>
